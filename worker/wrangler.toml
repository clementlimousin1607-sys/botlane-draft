# Relais Claude de Botlane Draft. Déploiement : voir ../docs/index.html#claude
name = "botlane-draft-ai"
main = "src/index.js"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]

[vars]
# Pages autorisées à appeler le relais (séparées par des virgules, sans / final).
# setup.sh remplace GITHUB_LOGIN par ton identifiant GitHub.
ALLOWED_ORIGINS = "https://GITHUB_LOGIN.github.io"
# data.json publié : patch, méta et patch notes injectés dans le prompt.
DATA_URL = "https://GITHUB_LOGIN.github.io/botlane-draft/data.json"
MODEL = "claude-opus-5"
# "low" : réponse courte et rapide. Vider EFFORT et FALLBACKS pour un modèle qui ne les accepte pas (ex. claude-haiku-4-5).
EFFORT = "low"
# Si Claude décline pour raison de politique, l'API relance la même demande sur le modèle de repli recommandé.
FALLBACKS = "default"
MAX_TOKENS = "4096"
# Quotas : par IP (IPv6 : par /64) et plafond global par jour (UTC), qui borne la facture.
PER_IP_PER_MINUTE = "3"
PER_IP_PER_DAY = "20"
GLOBAL_PER_DAY = "100"

# Compteurs de quotas (Durable Object SQLite, disponible sur l'offre gratuite).
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]
